services:
  - type: web
    name: tasks-api
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/tasks-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: tasks-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: tasks-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tasks-db
          property: password

databases:
  - name: tasks-db
    plan: free
    databaseName: tasksdb